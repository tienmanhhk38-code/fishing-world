name: Game checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fishing
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fishing_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fishing -d fishing_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://fishing:ci-only-password@127.0.0.1:5432/fishing_ci
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @fishing/server exec prisma migrate deploy
      - run: pnpm build
      - run: pnpm audit --audit-level low
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Start local game
        run: |
          mkdir -p .local
          pnpm dev > .local/ci-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null && curl -fsS http://127.0.0.1:2567/readyz > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: pnpm exec playwright test
      - run: pnpm exec playwright test -c playwright.cross.config.ts
      - run: node scripts/check-latency.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: test-diagnostics
          path: |
            test-results/
            .local/*.png
            .local/ci-server.log
          retention-days: 7
